<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SmartStore Pro</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#3f51b5"/>
  <!-- QuaggaJS & idb-keyval -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script src="https://unpkg.com/idb-keyval@6/dist/idb-keyval.iife.js"></script>
  <style>
    body {font-family:sans-serif;margin:0;padding:1rem;max-width:480px;background:#f4f4f4}
    header {text-align:center;margin-bottom:1rem}
    section {background:#fff;padding:1rem;margin-bottom:1rem;border-radius:8px;
             box-shadow:0 2px 5px rgba(0,0,0,0.1)}
    input,select,button {width:100%;padding:.5rem;margin:.25rem 0;
                         border:1px solid #ccc;border-radius:4px}
    button {background:#3f51b5;color:#fff;border:none;cursor:pointer}
    button:active {opacity:.8}
    .scanner {height:200px;border:2px dashed #bbb;border-radius:4px;
              position:relative;overflow:hidden}
    canvas#overlay {position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
    ul {list-style:none;padding:0}
    li {display:flex;justify-content:space-between;padding:.5rem 0;
        border-bottom:1px solid #eee}
    .low-stock {background:#ffe5e5}
    .small-btn {font-size:.8rem;padding:.25rem .5rem;margin-left:.25rem;
                background:#e53935;color:#fff;border:none;cursor:pointer}
    @keyframes currencyAnim {
      0%   {transform:scale(1);color:#3f51b5}
      50%  {transform:scale(1.3);color:#ff9800}
      100% {transform:scale(1);color:#3f51b5}
    }
    .currency {display:inline-block;margin-right:2px;animation:currencyAnim .5s ease-out}
  </style>
</head>
<body>
  <header><h1>SmartStore Pro</h1></header>

  <!-- Scanner Mode -->
  <section>
    <h2>📷 Scanner Mode</h2>
    <label><input type="radio" name="mode" value="add" checked/> Add Product</label>
    <label><input type="radio" name="mode" value="lookup"/> Lookup Price</label>
    <div id="scanner" class="scanner">
      <canvas id="overlay"></canvas>
    </div>
    <button onclick="startScanner()">Start Scanner</button>
    <button onclick="stopScanner()">Stop Scanner</button>
    <div id="scan-feedback" style="margin-top:.5rem;font-weight:bold"></div>
  </section>

  <!-- Manual Entry -->
  <section>
    <h2>📦 Add / Edit Product</h2>
    <input id="p-name" placeholder="Name (required)"/>
    <input id="p-price" type="number" placeholder="Price (required)"/>
    <input id="p-qty" type="number" placeholder="Quantity (required)"/>
    <input id="p-category" placeholder="Category"/>
    <input id="p-supplier" placeholder="Supplier"/>
    <input id="p-reorder" type="number" placeholder="Reorder Level"/>
    <button onclick="addOrUpdateProduct()">Save Product</button>
  </section>

  <!-- Inventory & Search -->
  <section>
    <h2>🔍 Inventory</h2>
    <select id="filter-category" onchange="renderProducts()">
      <option value="">All Categories</option>
    </select>
    <input id="search" placeholder="Search products..." oninput="renderProducts()"/>
    <ul id="product-list"></ul>
    <button onclick="exportCSV(products,'inventory.csv')">Export Inventory CSV</button>
  </section>

  <!-- Sales Log -->
  <section>
    <h2>💰 Sales Log</h2>
    <div>Total Revenue Today: <span class="currency">NPR</span><span id="daily-total">0</span></div>
    <ul id="sales-list"></ul>
    <button onclick="exportCSV(sales,'sales.csv')">Export Sales CSV</button>
  </section>

  <audio id="beep" src="beep.ogg"></audio>

  <script>
  // IndexedDB helpers
  const {get,set} = idbKeyval;

  // App state
  let products = [], sales = [], editIndex = null, scannerActive = false;

  // On load
  window.onload = async () => {
    products = await get('products') || [];
    sales    = await get('sales')    || [];
    populateCategoryFilter();
    renderProducts();
    renderSales();
    registerSW();
  };

  // Service worker registration
  function registerSW() {
    if('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  }

  // Save state
  async function saveData() {
    await set('products',products);
    await set('sales',sales);
  }

  // Category filter
  function populateCategoryFilter() {
    const sel = filterCategory;
    const cats = [...new Set(products.map(p=>p.category).filter(c=>c))];
    sel.innerHTML = '<option value="">All Categories</option>';
    cats.forEach(c=> sel.innerHTML += `<option value="${c}">${c}</option>`);
  }

  // Add / update product
  function addOrUpdateProduct() {
    const name = pName.value.trim();
    const price= parseFloat(pPrice.value);
    const qty  = parseInt(pQty.value,10);
    if(!name||isNaN(price)||isNaN(qty)) return alert('Name, price & quantity required.');
    const item = {
      name,price,qty,
      category: pCategory.value.trim(),
      supplier: pSupplier.value.trim(),
      reorder:  parseInt(pReorder.value,10)||0
    };
    if(editIndex!==null) { products[editIndex]=item; editIndex=null; }
    else products.push(item);
    clearEntry(); populateCategoryFilter();
    saveData().then(renderProducts);
  }

  function clearEntry(){
    [pName,pPrice,pQty,pCategory,pSupplier,pReorder].forEach(el=> el.value='');
  }

  // Render inventory
  function renderProducts(){
    const term = search.value.toLowerCase(), cat = filterCategory.value;
    productList.innerHTML='';
    populateCategoryFilter();
    products.forEach((p,i)=>{
      if(term&&!p.name.toLowerCase().includes(term)) return;
      if(cat&&p.category!==cat) return;
      const li=document.createElement('li');
      li.className = (p.reorder&&p.qty<=p.reorder)?'low-stock':'';
      li.innerHTML=`
        <span>${p.name} — <span class="currency">NPR</span>${p.price} × ${p.qty}${p.category? ' ['+p.category+']':''}</span>
        <span>
          <button class="small-btn" onclick="sell(${i})">Sell</button>
          <button onclick="edit(${i})">Edit</button>
          <button onclick="del(${i})">Delete</button>
        </span>`;
      productList.appendChild(li);
    });
    updateDailyTotal();
  }

  function edit(i){
    editIndex=i;
    const p=products[i];
    [pName,pPrice,pQty,pCategory,pSupplier,pReorder].forEach((el,idx)=>
      el.value=Object.values(p)[idx]
    );
  }

  function del(i){
    products.splice(i,1);
    saveData().then(renderProducts);
  }

  // Sell a unit
  function sell(i){
    if(products[i].qty>0){
      products[i].qty--;
      sales.push({name:products[i].name,price:products[i].price,time:new Date().toISOString()});
      saveData().then(renderProducts).then(renderSales);
    }
  }

  // Render sales
  function renderSales(){
    salesList.innerHTML='';
    sales.forEach(s=>{
      const li=document.createElement('li');
      li.innerHTML=`${new Date(s.time).toLocaleTimeString()} – ${s.name} <span class="currency">NPR</span>${s.price}`;
      salesList.appendChild(li);
    });
    updateDailyTotal();
  }

  // Daily total
  function updateDailyTotal(){
    const today=new Date().toISOString().slice(0,10);
    const total=sales.filter(s=>s.time.startsWith(today))
                     .reduce((sum,s)=>sum+s.price,0);
    dailyTotal.textContent=total;
  }

  // CSV export
  function exportCSV(data,filename){
    const rows=data.map(d=>Object.values(d).join(',')).join('\n');
    const blob=new Blob([rows],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    Object.assign(document.createElement('a'),{href:url,download:filename}).click();
    URL.revokeObjectURL(url);
  }

  // Scanner: enforce price→name→qty
  function startScanner(){
    if(scannerActive) return;
    scannerActive=true; scanFeedback.textContent='';
    const mode=document.querySelector('input[name=mode]:checked').value;
    const scannerEl=document.getElementById('scanner');
    const overlay=document.getElementById('overlay');
    // match canvas size to container
    overlay.width = scannerEl.clientWidth;
    overlay.height= scannerEl.clientHeight;

    Quagga.init({
      inputStream:{type:'LiveStream',target:scannerEl,constraints:{facingMode:'environment'}},
      locator:{patchSize:'medium',halfSample:true},
      numOfWorkers:navigator.hardwareConcurrency||4,
      decoder:{readers:['ean_reader','code_128_reader','upc_reader','upc_e_reader']},
      locate:true,frequency:15
    }, err=>{
      if(err){ console.error(err); return; }
      Quagga.start();
    });

    Quagga.onProcessed(res=>{
      const ctx=overlay.getContext('2d');
      ctx.clearRect(0,0,overlay.width,overlay.height);
      if(res&&res.box) drawPath(res.box,ctx,'rgba(0,255,0,0.5)');
    });

    let lastCode=null;
    Quagga.onDetected(data=>{
      const code=data.codeResult.code;
      if(code===lastCode) return;
      lastCode=code; beep.play();

      if(mode==='add'){
        const price=parseFloat(prompt(`Barcode: ${code}\nEnter Price (required)`));
        if(isNaN(price)){ scanFeedback.textContent='Price required. Scan cancelled.'; return stopScanner(); }
        const name=prompt(`Enter Name for NPR${price}`)?.trim();
        if(!name){ scanFeedback.textContent='Name required. Scan cancelled.'; return stopScanner(); }
        const qty=parseInt(prompt(`Enter Quantity for ${name}`),10);
        if(isNaN(qty)){ scanFeedback.textContent='Qty required. Scan cancelled.'; return stopScanner(); }
        const category=prompt('Category (optional)')||'';
        const supplier=prompt('Supplier (optional)')||'';
        const reorder=parseInt(prompt('Reorder Level (optional)'),10)||0;
        products.push({name,price,qty,category,supplier,reorder});
        saveData().then(populateCategoryFilter).then(renderProducts);
        scanFeedback.textContent=`Added: ${name}`;
      } else {
        const p=products.find(x=>x.name.includes(code));
        scanFeedback.innerHTML=p
          ? `✅ ${p.name}<br><span class="currency">NPR</span>${p.price} × ${p.qty}`
          : `❌ Not found: ${code}`;
      }
      stopScanner();
    });
  }

  function stopScanner(){
    if(!scannerActive) return;
    Quagga.stop();
    scannerActive=false;
  }

  function drawPath(path,ctx,color){
    ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.beginPath();
    path.forEach((pt,i)=> i? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y));
    ctx.closePath(); ctx.stroke();
  }
  </script>
</body>
</html>
